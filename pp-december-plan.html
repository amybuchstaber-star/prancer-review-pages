<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PaleoPro December Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--forest:#1F3A28;--forest-2:#2E4A35;--gold:#C8952A;--gold-2:#E0AE45;--brick:#9D4C32;--cream:#EFE3C9;--cream-2:#F6EEDA;--parch:#E7D8B6;--ink:#221C14;--muted:#6a5a45;--line:#d9c9a8;--card:#FBF5E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream-2);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:5;background:var(--forest);color:var(--cream-2);padding:10px 16px 8px}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:640px;margin:0 auto}
.brand{font:700 15px 'Fraunces',serif;letter-spacing:.04em}
.save{font-size:12px;opacity:.85}
.bar{max-width:640px;margin:8px auto 0;height:5px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold-2);transition:width .3s}
main{max-width:640px;margin:0 auto;padding:22px 16px 190px}
.kick{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
h1{font:700 30px/1.15 'Fraunces',serif;color:var(--forest);margin:6px 0 12px}
h2{font:700 24px/1.2 'Fraunces',serif;color:var(--forest);margin:6px 0 10px}
p{margin:0 0 12px}
.ctx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.ctx ul{margin:6px 0 0;padding-left:18px}.ctx li{margin:3px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin:0 6px 6px 0;background:var(--parch);color:var(--forest)}
.tag.ben{background:#F3D9C9;color:var(--brick)}
.opts{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.opt{text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.opt b{display:block;font-size:16px}
.opt span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.opt .pick{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--gold);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.opt.on{border-color:var(--forest);background:#EEF3EC;box-shadow:inset 0 0 0 1px var(--forest)}
.email{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.email .subj{font:700 20px/1.25 'Fraunces',serif;color:var(--forest);margin:4px 0 8px}
.email dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.email dt{font-weight:700;color:var(--muted)}.email dd{margin:0}
label.nl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 6px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;resize:vertical}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--cream-2) 30%);padding:18px 16px calc(74px + env(safe-area-inset-bottom))}
.nav .row{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font:700 16px 'DM Sans',sans-serif;cursor:pointer}
.btn.back{flex:0 0 96px;background:var(--parch);color:var(--forest)}
.btn.next{background:var(--forest);color:var(--cream-2)}
.btn.gold{background:var(--gold);color:#fff;display:block;width:100%;text-align:center;text-decoration:none;margin:10px 0}
.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:0 0 14px}
.sum div{padding:10px 0;border-bottom:1px solid var(--cream)}.sum div:last-child{border:0}
.sum small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sum em{display:block;color:var(--muted);font-size:14px}
.sum button{all:unset;cursor:pointer;display:block;width:100%}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.rule{height:1px;background:var(--line);margin:18px 0}
</style>
</head>
<body>
<div class="top"><div class="row"><span class="brand">PALEO PRO · DECEMBER</span><span class="save" id="save">Not saved yet</span></div><div class="bar"><i id="bar"></i></div></div>
<main id="main"></main>
<div class="nav"><div class="row"><button class="btn back" id="back">Back</button><button class="btn next" id="next">Start</button></div></div>
<div class="toast" id="toast"></div>
<script>
const CC='https://claude.ai/artifact/JmYoPQ52uZNu49donpDRpv';
const FORM_ID='pp-december-plan-v1';
const FB='https://prancer-website-devs-default-rtdb.firebaseio.com/pages/'+FORM_ID;
const BEN='<span class="tag ben">Ben signs off: has the offer</span>';
const NOTE='Anything to change? (optional)';

const S=[
{t:'intro'},

{id:'threshold',sec:'Free-bag offer',q:'What should a cart reach to get the free bag in December?',
ctx:`<p>The free bag is one Protein+ Multi-Collagen bag ($39.99), in Ancient Cacao or Aztec Vanilla. Shopify checks the cart total before discounts.</p><ul><li><b>Two bags of Paleo Protein cost $91.99,</b> so they miss $99 by $7. Two Beef Protein Isolate bags ($99.98) clear it.</li><li><b>Margin stays ahead:</b> a second bag adds about $14 of margin and the free bag costs $10.10, so a 2-bag order with the gift still beats a 1-bag order.</li><li><b>Vanilla is the reason to be generous:</b> about 580 vanilla bags would expire unsold at today's pace.</li></ul>`,
tags:BEN,
opts:[
{v:'99',label:'$99',hint:'Your idea. Clean number, but most 2-bag carts fall a few dollars short and need a third item.'},
{v:'90',label:'$90',pick:true,hint:'Two bags of Paleo Protein or Beef Isolate qualify. Still asks for a second bag, and moves more vanilla.'},
{v:'75',label:'$75',hint:'Almost any 2-bag cart qualifies, including 2 bags of Protein+. Uses the most bags.'},
{v:'2bags',label:'Any 2 bags, no dollar line',hint:'The same rule as Black Friday, so the discount and cart are already built that way.'}]},

{id:'choice',sec:'Free-bag offer',q:'How should shoppers pick chocolate or vanilla?',
ctx:`<p>Shopify gives a free item on its own only when that item is already in the cart, so the theme has to add the bag. The cart drawer already has free-gift code from Black Friday that can be reused.</p><p>I couldn't see how many chocolate bags are on hand.</p>`,
opts:[
{v:'picker',label:'Two buttons in the cart',pick:true,hint:'Once the cart clears the line, the drawer shows "Pick your free bag: Chocolate or Vanilla" and adds the one they tap. Vanilla sits first.'},
{v:'vanilla-swap',label:'Vanilla goes in on its own, with a "switch to chocolate" link',hint:'Moves the most vanilla. One extra tap for chocolate fans.'},
{v:'vanilla-only',label:'Vanilla only',hint:'Simplest, and clears the expiring stock fastest. No choice for the shopper.'}]},

{id:'start',sec:'Free-bag offer',q:'When should the December offer switch on?',
ctx:`<p>Black Friday ends Dec 2 at 11:59 PM Pacific. The theme already hides the old $120 free-bag tier from Dec 3, and the cart drawer still mentions $120 in places, which gets cleaned up with this build.</p>`,
opts:[
{v:'dec3-0000',label:'Dec 3, 12:00 AM Pacific',pick:true,hint:'No gap after the sale, so the Dec 3 email can lead with it.'},
{v:'dec4',label:'Dec 4, 12:00 AM Pacific',hint:'A one-day gap keeps Black Friday results separate.'}]},

{id:'end',sec:'Free-bag offer',q:'When should the free bag end?',
ctx:`<p>You asked for it live all of December. You also floated running the gift into January, since Black Friday should only use about 170 to 200 vanilla bags.</p>`,
opts:[
{v:'dec31',label:'Dec 31, 11:59 PM Pacific',hint:'The Dec 31 email becomes a last call.'},
{v:'jan31',label:'Run it through January',pick:true,hint:'Keeps working on the vanilla stock. The Dec 31 email says it carries on.'},
{v:'stock',label:'Until the vanilla runs out',hint:'Open-ended. Harder to write a deadline into emails.'}]},

{id:'gc_how',sec:'$10 subscriber thank-you',q:'How should each active subscriber get their own $10 link?',
ctx:`<p>Recharge already syncs active subscribers into Klaviyo, so the send itself is a Klaviyo segment. The question is what the link holds.</p><p>I couldn't see how many active subscribers there are, so I can't put a total cost on it yet.</p>`,
tags:BEN,
opts:[
{v:'klaviyo-codes',label:'Unique $10 codes from Klaviyo',pick:true,hint:'Klaviyo makes one single-use Shopify code per person and builds a link that applies it in one tap. No app, nothing to buy.'},
{v:'shopify-giftcards',label:'Real Shopify gift cards',hint:'A true gift card balance, but each one is issued in Shopify, so it needs Shopify Flow or a bulk gift-card app.'}]},

{id:'gc_rules',sec:'$10 subscriber thank-you',q:'What rules should the $10 come with?',
ctx:`<p>Whatever you pick here, I'd also let it stack with the free bag so a subscriber never feels the thank-you cost them the gift.</p>`,
tags:BEN,
opts:[
{v:'none-jan31',label:'No minimum, use by Jan 31',hint:'Easiest to love. Some people will check out a $10 order.'},
{v:'40-jan31',label:'On orders of $40 or more, use by Jan 31',hint:'Still covers one bag of almost anything.'},
{v:'none-dec31',label:'No minimum, use by Dec 31',hint:'Pulls the order into December.'}]},

{id:'gc_date',sec:'$10 subscriber thank-you',q:'When should the thank-you go out?',
ctx:`<p>Subscribers come back at 86%, against 16% for one-time buyers, so this group is worth a quiet, personal note away from the sale noise.</p>`,
opts:[
{v:'dec8',label:'Tue Dec 8',pick:true,hint:'Early enough to spend on gifts that ship before Christmas.'},
{v:'dec15',label:'Tue Dec 15',hint:'Closer to Christmas, a day before the order-by date.'},
{v:'dec22',label:'Tue Dec 22',hint:'Pure thank-you. Most of it gets spent in January.'}]},

{id:'shipby',sec:'Christmas shipping',q:'What order-by date should the emails promise for Christmas?',
ctx:`<p>Christmas is a Friday. I couldn't see shipping times from Vista, so this assumes orders leave within one business day by ground. Please check with whoever packs orders before it goes in an email.</p>`,
opts:[
{v:'dec15',label:'Tue Dec 15',hint:'The safest promise.'},
{v:'dec16',label:'Wed Dec 16',pick:true,hint:'Leaves about six business days for ground shipping.'},
{v:'dec17',label:'Thu Dec 17',hint:'Tight if any order sits for a day.'}]},

{t:'email',id:'e01',sec:'Week 1',date:'Thu Dec 3',to:'Everyone',subj:'The sale ended. The free bag didn’t.',angle:'Bridge from Black Friday. Announces the December offer: a free Protein+ Multi-Collagen bag, chocolate or vanilla, over the threshold, all month.',blog:'Protein powder with collagen',ben:true},
{t:'email',id:'e02',sec:'Week 1',date:'Sun Dec 6',to:'Everyone',subj:'Nobody needs another air fryer',angle:'Buy Mom and Dad protein instead: a gift they use every morning, not one more gadget. The copy says Mom and Dad and never names an age.',blog:'Best protein drinks for seniors'},
{t:'email',id:'e03',sec:'Week 2',date:'Tue Dec 8',to:'Everyone except active subscribers',subj:'Gifts that end up in a cabinet (and one that doesn’t)',angle:'A gift gets used when it fits a habit they already have. One scoop in the morning shake, every day.',blog:'When to drink a protein shake'},
{t:'email',id:'e03s',sec:'Week 2',date:'Tue Dec 8',to:'Active subscribers only',subj:'A $10 thank-you, from all of us',angle:'Short, personal thank-you for being a Paleo Pro customer, with their own $10 link. Plain, letter-style design, not a sale email.',blog:'Egg white protein powder recipes (a nudge to try something new)',ben:true},
{t:'email',id:'e04',sec:'Week 2',date:'Thu Dec 10',to:'Everyone',subj:'Protein is the best stocking stuffer',angle:'Stocking stuffer no. 1: Paleo Protein. Five ingredients and 26 g of protein, in a bag that fits the stocking.',blog:'Protein powder and heavy metals (what is and isn’t in the bag)'},
{t:'email',id:'e05',sec:'Week 2',date:'Sun Dec 13',to:'Everyone',subj:'Stocking stuffer no. 2: nose to tail',angle:'Beef Organ Complex and Beef Liver for the person who has everything. Site claims only.',blog:'Best beef organ supplements for women'},
{t:'email',id:'e06',sec:'Week 3',date:'Tue Dec 15',to:'Everyone',subj:'One gift for everyone on your list',angle:'Gift guide by person: the lifter (Beef Protein Isolate), the coffee drinker (Protein+ in chocolate), the carnivore (Carnivore Complete), the baker (Egg White). Order-by date in the header.',blog:'What you can eat on the carnivore diet'},
{t:'email',id:'e07',sec:'Week 3',date:'Wed Dec 16',to:'Everyone',subj:'Last day to order for Christmas',angle:'Deadline email. Order today to have it under the tree, and the free bag is still on. Moves if you pick another order-by date.',blog:'None. One button to shop.',ben:true},
{t:'email',id:'e08',sec:'Week 3',date:'Sun Dec 20',to:'Everyone',subj:'The one gift you forgot: you',angle:'Self-gift. Everyone else is sorted, so start your own January early, with the free bag as the reason to order now.',blog:'Best protein powder for women',ben:true},
{t:'email',id:'e09',sec:'Week 4',date:'Tue Dec 22',to:'Everyone',subj:'Christmas morning, sorted',angle:'High-protein breakfast for the house full of guests. Recipes first, products second.',blog:'High-protein muffins'},
{t:'email',id:'e10',sec:'Week 4',date:'Thu Dec 24',to:'Everyone',subj:'Merry Christmas from Paleo Pro',angle:'A short thank-you note with no sale in it. Keeps the list warm for the week after.',blog:'None'},
{t:'email',id:'e11',sec:'Week 4',date:'Sun Dec 27',to:'Everyone',subj:'Got a gift card? Start with one scoop',angle:'For people spending Christmas money. Start with one bag, and the free bag still comes with a bigger cart.',blog:'Protein powder vs meal replacement',ben:true},
{t:'email',id:'e12',sec:'Week 5',date:'Tue Dec 29',to:'Everyone',subj:'January starts in your kitchen',angle:'How much protein you need, made simple, with subscribe and save as the easy way to keep it going.',blog:'How much protein women need'},
{t:'email',id:'e13',sec:'Week 5',date:'Thu Dec 31',to:'Everyone',subj:'Last call on the free bag',angle:'If the offer ends Dec 31, this is the last call. If it runs into January, it becomes "New year, same free bag".',blog:'Does collagen count as protein?',ben:true},

{id:'tiff',sec:'Hand-off to Tiff',q:'When should Tiff have the email briefs?',
ctx:`<p>Tiff builds the emails in Figma and you review them before they're scheduled. The Dec 3 email has to be built while she's still on Black Friday.</p>`,
opts:[
{v:'wk1-nov25',label:'Week 1 by Wed Nov 25, the rest by Wed Dec 2',hint:'Two drops, so Black Friday isn’t crowded.'},
{v:'all-nov25',label:'All 14 by Wed Nov 25',hint:'One drop. She can batch the whole month.'},
{v:'weekly',label:'Each week’s briefs a week ahead',hint:'Easiest to change as December goes.'}]},

{t:'finish'}
];

const EMAIL_OPTS=[{v:'keep',label:'Keep it'},{v:'change',label:'Keep it, with changes in my note'},{v:'cut',label:'Cut it'}];
const FINISH_OPTS=[{v:'go',label:'Go ahead with this plan',hint:'I write the email briefs for Tiff and the offer build for your review. Nothing goes live without your yes.'},{v:'look',label:'Show me a revised version first',hint:'I change what your notes ask for and send it back.'},{v:'hold',label:'Hold for now'}];

const LS='pp-dec-plan-v1';
let A={},pos=0,who='Amy';
try{const l=JSON.parse(localStorage.getItem(LS)||'null');if(l){A=l.A||{};pos=l.pos||0;}}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function local(){try{localStorage.setItem(LS,JSON.stringify({A,pos}));}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}
let pend={},timer=null;
function setSave(s){$('save').textContent=s;}
function queue(id){A[id].ts=Date.now();A[id].name=who;local();pend['answers/'+id]=Object.assign({},A[id],{name:who,ts:Date.now()});clearTimeout(timer);setSave('Saving…');timer=setTimeout(flush,700);}
function flush(){if(!Object.keys(pend).length)return Promise.resolve();const body=Object.assign({},pend,{'meta/updated':Date.now()});pend={};
 return fetch(FB+'.json',{method:'PATCH',body:JSON.stringify(body)}).then(r=>{if(!r.ok)throw 0;setSave('Saved ✓');}).catch(()=>{Object.assign(pend,body);delete pend['meta/updated'];setSave('Offline: saved on this phone');});}
function optsOf(s){return s.t==='email'?EMAIL_OPTS:s.t==='finish'?FINISH_OPTS:s.opts;}
function steps(){return S.filter(s=>s.id||s.t==='finish');}
function answered(){return S.filter(s=>s.id&&A[s.id]&&A[s.id].v).length;}
function prog(){const tot=S.filter(s=>s.id).length;$('bar').style.width=Math.round(100*pos/(S.length-1))+'%';}
function labelOf(s,v){const o=(optsOf(s)||[]).find(o=>o.v===v);return o?o.label:'';}

function optHTML(s){const cur=(A[s.id]||{}).v;return '<div class="opts">'+optsOf(s).map(o=>`<button class="opt${cur===o.v?' on':''}" data-v="${esc(o.v)}"><b>${esc(o.label)}${o.pick?'<span class="pick">My pick</span>':''}</b>${o.hint?`<span>${esc(o.hint)}</span>`:''}</button>`).join('')+'</div>';}
function noteHTML(s,label){return `<label class="nl" for="nt">${esc(label||NOTE)}</label><textarea id="nt" placeholder="Type or dictate a note">${esc((A[s.id]||{}).note||'')}</textarea>`;}
function qNum(s){const qs=S.filter(x=>x.id&&x.t!=='finish'&&(s.t==='email'?x.t==='email':x.t!=='email'));return qs.indexOf(s)+1+' of '+qs.length;}

function render(){
 const s=S[pos],m=$('main');window.scrollTo(0,0);
 $('back').style.visibility=pos===0?'hidden':'visible';
 if(s.t==='intro'){
  m.innerHTML=`<div class="kick">For Amy · about 6 minutes</div><h1>December at Paleo Pro</h1>
  <p>One decision a screen. Tap the answer that fits, add a note if you want, and it saves as you go.</p>
  <div class="ctx"><b>Already settled, from what you said:</b><ul><li>Three emails a week, Dec 3 to Dec 31.</li><li>A free bag on orders over a line, live all December, chocolate or vanilla.</li><li>A $10 thank-you to every active subscriber, each with their own link.</li><li>Air-fryer and stocking-stuffer emails that send people to the blog.</li></ul></div>
  <div class="ctx"><b>What's in here:</b> 8 offer and timing questions, then the 14 emails one at a time (13 to everyone, 1 to subscribers), then the hand-off to Tiff. Where I have a view it's marked <span class="tag" style="background:var(--gold);color:#fff">My pick</span>. Anything with the offer in it is marked for Ben's sign-off.</div>
  <p style="font-size:14px;color:var(--muted)">Nothing here changes the store, Klaviyo or Recharge. It's a plan for your yes.</p>`;
  $('next').textContent=answered()?'Pick up where I left off':'Start';prog();return;}
 if(s.t==='finish'){
  const rows=S.filter(x=>x.id&&x.id!=='finish').map(x=>{const a=A[x.id]||{};const nm=x.t==='email'?`${x.date}: ${x.subj}`:x.q;
   return `<div><button data-go="${S.indexOf(x)}"><small>${esc(x.sec)}</small>${esc(nm)}<em>${a.v?esc(labelOf(x,a.v)):'Not answered yet · tap to answer'}${a.note?' · '+esc(a.note):''}</em></button></div>`;}).join('');
  m.innerHTML=`<div class="kick">All done</div><h2>How should I go from here?</h2>${optHTML(s)}${noteHTML(s,'Anything else for me or Ben? (optional)')}
  <div class="rule"></div><div class="kick" style="margin-bottom:8px">Your answers</div><div class="sum">${rows}</div>
  <a class="btn gold" href="${CC}" id="cc">Back to the Command Center</a>`;
  bind(s);m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{pos=+b.dataset.go;local();render();});
  $('cc').onclick=()=>{flush();};
  $('next').textContent='Back to the Command Center';prog();return;}
 let body;
 if(s.t==='email'){
  body=`<div class="kick">${esc(s.sec)} · Email ${qNum(s)}</div><h2>Keep this email?</h2>
  <div class="email"><span class="tag">${esc(s.date)}</span><span class="tag">${esc(s.to)}</span>${s.ben?BEN:''}
  <div class="subj">${esc(s.subj)}</div><dl><dt>Angle</dt><dd>${esc(s.angle)}</dd><dt>Blog</dt><dd>${esc(s.blog)}</dd></dl></div>
  ${optHTML(s)}${noteHTML(s,'New subject line, angle or post (optional)')}`;
 } else {
  body=`<div class="kick">${esc(s.sec)} · Question ${qNum(s)}</div><h2>${esc(s.q)}</h2>${s.tags||''}<div class="ctx">${s.ctx}</div>${optHTML(s)}${noteHTML(s)}`;
 }
 m.innerHTML=body;bind(s);$('next').textContent='Next';prog();
}
function bind(s){
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{A[s.id]=Object.assign({},A[s.id],{v:b.dataset.v,label:labelOf(s,b.dataset.v)});
  document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));local();queue(s.id);});
 const nt=$('nt');if(nt)nt.oninput=()=>{A[s.id]=Object.assign({},A[s.id],{note:nt.value});local();queue(s.id);};
}
$('next').onclick=()=>{const s=S[pos];
 if(s.t==='finish'){flush().finally(()=>{location.href=CC;});return;}
 if(s.t==='intro'&&answered()){const i=S.findIndex(x=>x.id&&!(A[x.id]&&A[x.id].v));pos=i<0?S.length-1:i;}else pos=Math.min(S.length-1,pos+1);
 local();render();};
$('back').onclick=()=>{pos=Math.max(0,pos-1);local();render();};
S.find(s=>s.t==='finish').id='finish';S.find(s=>s.t==='finish').sec='Finish';S.find(s=>s.t==='finish').q='How should I go from here?';
fetch(FB+'.json').then(r=>r.json()).then(d=>{if(d&&d.answers){for(const k in d.answers){if(!A[k]||((d.answers[k].ts||0)>(A[k].ts||0)))A[k]=d.answers[k];}local();render();setSave('Saved ✓');}}).catch(()=>{});
render();
</script>

<!-- ==== CLAUDE COMMENTS WIDGET (connected to prancer-website-devs) ==== -->
<script>
/* ============================================================
   CLAUDE COMMENTS — Figma-style comment layer for any HTML page
   ------------------------------------------------------------
   HOW TO USE:
   1. Set FIREBASE_URL below to your Firebase Realtime Database
      URL (looks like https://something-default-rtdb.firebaseio.com)
      Leave it as-is to run in OFFLINE mode (comments only saved
      in this browser — good for trying it out).
   2. Optionally set PAGE_ID to a short name for this page.
      If left blank, it's derived from the file name / title.
   3. Paste this whole <script> block right before </body>.
   ============================================================ */
(function () {
  'use strict';

  /* ------------------- CONFIG ------------------- */
  var FIREBASE_URL = 'https://prancer-website-devs-default-rtdb.firebaseio.com';
  var PAGE_ID = 'pp-december-plan-v1';

  /* ---------------------------------------------- */

  if (window.__claudeCommentsLoaded) return;
  window.__claudeCommentsLoaded = true;

  function cssPath(el) {

  function buildThreadPopup(tid) {
    var t = threads[tid];
    var p = threadVisiblePos(t)
      || { x: window.scrollX + window.innerWidth / 2, y: window.scrollY + window.innerHeight / 2 };
    var pos = popupPos(p.x, p.y);
    var pop = document.createElement('div');
    pop.className = 'popup';
    pop.style.left = pos.left + 'px';
    pop.style.top = pos.top + 'px';

    var head = document.createElement('div');
    head.className = 'popup-head';
    head.innerHTML = '<span class="title">Comment #' + threadNumber(tid) + '</span>';
    var resolveBtn = document.createElement('button');
    resolveBtn.className = 'iconbtn';
    resolveBtn.innerHTML = t.resolved ? '&#8634; Reopen' : '&#10003; Resolve';
    resolveBtn.addEventListener('click', function () {
      store.patchThread(tid, { resolved: !t.resolved }).then(function () {
        if (!t.resolved === true && !showResolved) openThreadId = null;
        return refresh(true);
      }).catch(syncFail);
    });
    var del = document.createElement('button');
    del.className = 'iconbtn danger';
    del.innerHTML = '&#128465;';
    del.title = 'Delete thread';
    del.addEventListener('click', function () {
      if (del.dataset.armed) {
        store.deleteThread(tid).then(function () { openThreadId = null; return refresh(true); }).catch(syncFail);
      } else {
        del.dataset.armed = '1';
        del.textContent = 'Delete?';
        setTimeout(function () { delete del.dataset.armed; del.innerHTML = '&#128465;'; }, 2500);
      }
    });
    var x = document.createElement('button');
    x.className = 'iconbtn'; x.innerHTML = '&#10005;';
    x.addEventListener('click', function () { openThreadId = null; render(); });
    head.appendChild(resolveBtn);
    head.appendChild(del);
    head.appendChild(x);
    pop.appendChild(head);

    var box = document.createElement('div');
    box.className = 'comments';
    var cids = Object.keys(t.comments || {}).sort(function (a, b) {
      return (t.comments[a].ts || 0) - (t.comments[b].ts || 0);
    });
    cids.forEach(function (cid) {
      var c = t.comments[cid];
      var row = document.createElement('div');
      row.className = 'comment';
      row.innerHTML = '<div class="avatar" style="background:' + colorFor(c.name) + '">'
        + esc((c.name || '?').trim().charAt(0).toUpperCase()) + '</div>'
        + '<div class="cbody"><div class="cmeta"><b>' + esc(c.name) + '</b>' + timeAgo(c.ts) + '</div>'
        + '<div class="ctext">' + esc(c.text) + '</div></div>';
      box.appendChild(row);
    });
    pop.appendChild(box);

    var comp = document.createElement('div');
    comp.className = 'composer';
    var nameIn = null;
    if (!myName) { nameIn = nameField(); comp.appendChild(nameIn); }
    var ta = document.createElement('textarea');
    ta.placeholder = 'Reply…';
    comp.appendChild(ta);
    var row2 = document.createElement('div');
    row2.className = 'crow';
    var post = document.createElement('button');
    post.className = 'btn primary'; post.textContent = 'Reply';
    post.addEventListener('click', function () {
      var text = ta.value.trim();
      var name = (nameIn ? nameIn.value.trim() : myName) || 'Anonymous';
      if (!text) { ta.focus(); return; }
      saveName(name);
      post.disabled = true;
      store.addComment(tid, { name: name, text: text, ts: Date.now() })
        .then(function () { return refresh(true); }).catch(syncFail);
    });
    ta.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') post.click();
      if (e.key === 'Escape') { openThreadId = null; render(); }
    });
    row2.appendChild(post);
    comp.appendChild(row2);
    pop.appendChild(comp);
    setTimeout(function () { box.scrollTop = box.scrollHeight; }, 30);
    return pop;
  }

  function saveName(name) {
    if (name && name !== 'Anonymous') {
      myName = name;
      try { localStorage.setItem('claude-comments-name', name); } catch (e) {}
    }
  }
  function syncFail(err) {
    alertBar('Couldn’t save — check your internet connection and try again.');
    render();
  }
  var alertTimer = null;
  function alertBar(msg) {
    var el = document.createElement('div');
    el.className = 'hint';
    el.style.background = '#c0264b';
    el.textContent = msg;
    ui.appendChild(el);
    clearTimeout(alertTimer);
    alertTimer = setTimeout(function () { el.remove(); }, 4000);
  }

  /* ------------------- COMMENT MODE ------------------- */
  function setMode(on) {
    commentMode = on;
    document.documentElement.classList.toggle('claude-commenting', on);
  }
  function toggleMode() {
    setMode(!commentMode);
    if (!commentMode) draft = null;
    openThreadId = null;
    render();
  }

  document.addEventListener('click', function (e) {
    if (!commentMode) return;
    if (e.composedPath && e.composedPath().indexOf(host) !== -1) return;
    e.preventDefault();
    e.stopPropagation();
    var target = null;
    var els = document.elementsFromPoint(e.clientX, e.clientY) || [];
    for (var i = 0; i < els.length; i++) {
      if (els[i] !== host && !host.contains(els[i])) { target = els[i]; break; }
    }
    draft = {
      anchor: makeAnchor(e.clientX, e.clientY, target),
      x: e.clientX + window.scrollX,
      y: e.clientY + window.scrollY
    };
    openThreadId = null;
    render();
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && commentMode && !draft) { setMode(false); render(); }
  });

  /* ------------------- SYNC LOOP ------------------- */
  function refresh(force) {
    return store.fetchAll().then(function (d) {
      d = d || {};
      var j = JSON.stringify(d);
      if (force || j !== lastJSON) {
        lastJSON = j;
        threads = d;
        render();
      }
    }).catch(function () { /* transient network error: keep current view */ });
  }

  var pollMs = ONLINE ? 4000 : 2500;
  setInterval(function () {
    // Don't re-render out from under someone mid-typing
    var typing = root.activeElement && /TEXTAREA|INPUT/.test(root.activeElement.tagName || '');
    if (!typing) refresh(false);
  }, pollMs);

  window.addEventListener('resize', function () { render(); });
  // Single-file sites that switch views via the URL hash: re-render so each
  // view only shows its own pins, and close any popup from the previous view.
  window.addEventListener('hashchange', function () {
    openThreadId = null; draft = null;
    render();
  });

  /* ------------------- BOOT ------------------- */
  function boot() {
    mount();
    refresh(true);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
