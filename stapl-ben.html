<style>
:root{--espresso:#1B1B1D;--ink:#121214;--bone:#F3F1EA;--aqua:#27D4C4;--sunshine:#FFC72C;--clay:#FF6B37;--coral:#FFBA6A;--ink-dim:rgba(27,27,29,.66);
  --mono:'Space Mono',monospace;--arch:'Archivo Variable','Archivo',sans-serif;--accent:#FFC72C;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bone);color:var(--espresso);font-family:var(--arch);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;}
a{color:inherit;}
.display{font-weight:900;font-variation-settings:'wdth' 118;text-transform:uppercase;line-height:.9;letter-spacing:-.015em;}
.mono{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;}
.bar{position:sticky;top:0;z-index:20;background:var(--espresso);color:var(--bone);display:flex;align-items:center;gap:1.2rem;padding:.8rem 1.4rem;}
.bar img{height:20px;}
.bar .who{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
.prog{flex:1;height:12px;border:2px solid var(--bone);position:relative;overflow:hidden;min-width:60px;}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width .4s cubic-bezier(.2,.7,.2,1);background-image:repeating-linear-gradient(-55deg,transparent 0 10px,rgba(27,27,29,.16) 10px 14px);}
.bar .ct{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;white-space:nowrap;}
.bar .save{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,241,234,.6);white-space:nowrap;}
.bar .save.ok{color:var(--aqua);} .bar .save.err{color:var(--coral);}
.stage{position:relative;max-width:920px;margin:0 auto;padding:3.2rem 1.4rem 8rem;}
.shape{position:fixed;pointer-events:none;z-index:0;}
.shape.a{top:-6%;right:-8%;width:30vw;height:56vh;background:var(--accent);clip-path:polygon(26% 0,100% 0,100% 100%,0 78%);opacity:.9;}
.shape.b{top:20%;right:16vw;width:5vw;height:26vh;border:4px solid var(--espresso);transform:skewX(-14deg);}
.shape.c{bottom:-10%;left:-8%;width:22vw;height:40vh;background:var(--sunshine);clip-path:polygon(0 8%,100% 24%,78% 100%,0 100%);opacity:.5;}
.card{position:relative;z-index:2;background:#fff;border:3px solid var(--espresso);box-shadow:12px 12px 0 var(--espresso);padding:2.4rem 2.4rem 2rem;}
.kick{display:flex;align-items:center;gap:.8rem;margin-bottom:1.4rem;flex-wrap:wrap;}
.kick .n{color:var(--clay);} .kick .ln{flex:0 0 40px;height:2px;background:var(--clay);}
.kick .sec{color:var(--ink-dim);}
.tagid{font-family:var(--mono);font-size:.56rem;font-weight:700;letter-spacing:.1em;background:var(--accent);border:1.5px solid var(--ink);padding:.15rem .4rem;text-decoration:none;white-space:nowrap;}
.tagid:hover{background:var(--sunshine);}
h1.display{font-size:clamp(2.6rem,8vw,5.4rem);} h1 em,h2 em{font-style:normal;color:var(--clay);}
h2.q{font-weight:900;font-variation-settings:'wdth' 112;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.08;text-transform:uppercase;}
.hint{margin-top:.8rem;color:var(--ink-dim);font-size:1rem;line-height:1.6;max-width:640px;}
.copy{margin-top:1.4rem;background:var(--bone);border-left:8px solid var(--accent);padding:1.2rem 1.3rem;font-size:1.08rem;line-height:1.65;white-space:pre-line;}
.copy small{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:.6rem;font-weight:700;}
.opts{display:grid;gap:.8rem;margin-top:1.6rem;}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
.opt{display:flex;align-items:center;gap:.9rem;text-align:left;background:#fff;border:2px solid var(--espresso);padding:1rem 1.1rem;font-size:1rem;font-weight:700;line-height:1.3;box-shadow:4px 4px 0 rgba(27,27,29,.16);transition:transform .15s,box-shadow .15s,background .15s;}
.opt:hover{transform:translate(-1px,-2px);box-shadow:6px 6px 0 var(--accent);}
.opt .k{flex:0 0 28px;height:28px;border:2px solid var(--espresso);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;background:var(--bone);}
.opt.on{background:var(--espresso);color:var(--bone);box-shadow:6px 6px 0 var(--accent);}
.opt.on .k{background:var(--accent);color:var(--ink);border-color:var(--accent);}
.opt.on .k::after{content:'✓';} .opt.on .k span{display:none;}
textarea,input[type=text]{display:block;width:100%;margin-top:1.2rem;background:var(--bone);border:2px solid var(--espresso);font-family:var(--arch);font-size:1.02rem;line-height:1.55;color:var(--espresso);padding:.95rem 1rem;outline:none;border-radius:0;}
textarea{min-height:130px;resize:vertical;} textarea.tall{min-height:220px;}
textarea:focus,input:focus{border-color:var(--accent);background:#fff;box-shadow:4px 4px 0 var(--accent);}
label.lab{display:block;margin-top:1.4rem;font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);}
label.lab+textarea,label.lab+input{margin-top:.5rem;}
.hide{display:none!important;}
.nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:2.2rem;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:.7rem;font-family:var(--mono);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;padding:1.05rem 1.6rem;background:var(--sunshine);color:var(--ink);text-decoration:none;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:transform .15s,background .2s;}
.btn:hover{transform:translateY(-2px);background:var(--clay);color:var(--bone);}
.btn.dark{background:var(--espresso);color:var(--bone);} .btn.dark:hover{background:var(--accent);color:var(--ink);}
.btn.ghost{background:none;clip-path:none;padding:.6rem 0;border-bottom:3px solid var(--accent);}
.btn.ghost:hover{background:none;color:var(--clay);transform:none;}
.skip{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);background:none;border-bottom:1px solid currentColor;}
.chips{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem;}
.chip{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding:.55rem .9rem;border:2px solid var(--espresso);box-shadow:3px 3px 0 var(--espresso);background:var(--sunshine);}
.chips .chip:nth-child(3n+2){background:var(--aqua);} .chips .chip:nth-child(3n){background:var(--coral);}
.secs{display:grid;gap:.6rem;margin-top:1.8rem;}
.secs div{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid rgba(27,27,29,.15);padding:.55rem 0;font-weight:700;}
.secs span{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--ink-dim);white-space:nowrap;}
.rev{margin-top:1.6rem;display:grid;gap:.7rem;}
.rev .r{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;border:2px solid var(--espresso);padding:.8rem 1rem;background:#fff;text-align:left;width:100%;}
.rev .r b{font-size:.92rem;line-height:1.3;} .rev .r span{font-size:.9rem;color:var(--ink-dim);grid-column:1/-1;line-height:1.45;white-space:pre-line;}
.rev .r i{font-style:normal;font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:.15rem .4rem;background:var(--aqua);align-self:start;}
.rev .r.miss i{background:var(--coral);} .rev .r.miss{border-style:dashed;}
.rev h3{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--clay);margin-top:1rem;}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);z-index:50;background:var(--espresso);color:var(--bone);font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:.8rem 1.1rem;border:2px solid var(--sunshine);opacity:0;pointer-events:none;transition:all .3s;max-width:90vw;text-align:center;}
.toast.on{opacity:1;transform:translate(-50%,0);}
.foot{position:relative;z-index:2;text-align:center;margin-top:2rem;font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);line-height:1.8;}
@media(max-width:700px){
  .stage{padding:1.6rem .9rem 6rem;} .card{padding:1.5rem 1.2rem 1.4rem;box-shadow:7px 7px 0 var(--espresso);}
  .shape.b,.shape.c{display:none;} .shape.a{width:44vw;height:30vh;opacity:.5;}
  .bar{gap:.7rem;padding:.7rem .9rem;} .bar .who,.bar .save{display:none;} .bar img{height:16px;}
  .nav .btn{padding:.95rem 1.1rem;font-size:.66rem;letter-spacing:.14em;}
}

.lbl{display:block;color:var(--ink-dim);margin-bottom:.7rem;font-size:.6rem;}
.lbl .diff,.rev .r i.df{background:var(--clay);color:#fff;padding:.12rem .4rem;margin-left:.5rem;}
.team{margin-top:1.6rem;border:2px solid var(--espresso);background:#EAF6F3;padding:1rem 1.1rem .4rem;}
.resp,.cm{background:#fff;border:2px solid var(--espresso);padding:.7rem .9rem;margin-bottom:.7rem;}
.by{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;}
.by b{font-size:.92rem;} .by i{font-style:normal;font-family:var(--mono);font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;}
.resp p,.cm p{margin-top:.3rem;font-size:.95rem;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere;}
.thread{margin-top:2rem;border-top:2px dashed rgba(27,27,29,.35);padding-top:1.3rem;}
.cm{box-shadow:4px 4px 0 var(--sunshine);} .cm.me{box-shadow:4px 4px 0 var(--accent);}
.thread .none{font-size:.9rem;color:var(--ink-dim);margin-bottom:.8rem;}
.addc{display:flex;gap:.6rem;align-items:stretch;} .addc input{margin-top:0;flex:1;} .addc .btn{padding:.8rem 1.2rem;clip-path:none;}
.rev .r span u{text-decoration:none;font-weight:800;color:var(--espresso);} .rev .r span em{font-style:normal;color:var(--clay);}
.bar .who{max-width:200px;overflow:hidden;text-overflow:ellipsis;}

</style>
</head>

  document.getElementById('back').onclick=()=>go(Math.max(0,Q.findIndex(q=>!isAns(q))));
  const copy=()=>navigator.clipboard.writeText(summary());
  document.getElementById('copy').onclick=()=>copy().then(()=>toast('Answers copied'),()=>toast('Copy failed — select the list below'));
  document.getElementById('mail').onclick=()=>{copy().catch(()=>{});
    location.href='mailto:?subject='+encodeURIComponent(FORM.title+' — answers')+'&body='+encodeURIComponent('The answers are copied to the clipboard. Paste them below this line and send to Amy.\n\n');};
  document.getElementById('submit').onclick=()=>{R.meta=R.meta||{};(R.meta.submitted=R.meta.submitted||{})[me.key]=Date.now();queue('meta/submitted/'+me.key,Date.now());flush().then(()=>{toast('Marked done — thank you');review();});};
}

document.getElementById('whoami').style.cursor='pointer';document.getElementById('whoami').title='Change name';document.getElementById('whoami').onclick=()=>go(-1);
progress();intro();
pull(true).then(()=>{lastSig=JSON.stringify([R.answers,R.comments]);if(me.pos<0)intro();});

</script>
